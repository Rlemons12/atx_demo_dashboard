[server]
http_addr = 127.0.0.1
http_port = 3001
domain = localhost

[security]
admin_user = admin
admin_password = admin
disable_initial_admin_creation = false

[auth]
disable_login_form = false

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[auth.basic]
enabled = true

[users]
default_theme = light

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console file
level = info
